# SPDX-License-Identifier: Apache-2.0
#
# Cutting a release: two container images under one tag, and three files on
# the GitHub release of that tag, and that is the release.
#
#   git tag -a v0.1.0 -m "…" && git push origin v0.1.0
#
# `rasonyang/ai-native-callcenter:<tag>` carries the executable with the SPA
# embedded in it and nothing else — no web server, no interpreter, no assets to
# unpack beside it. `rasonyang/freeswitch-aicc:<tag>` is the switch built from
# `freeswitch/` at the same commit. The two share the `luacc.*` contract (the
# application's migrations define the views, the switch's Lua scripts read
# them), so they are built by one run from one commit and published under one
# tag. A deployment names both in `AICC_IMAGE` / `AICC_FS_IMAGE` and pulls;
# `deploy/README.md` is that procedure.
#
# The GitHub release carries what the one-line installer downloads, built by
# `scripts/release-bundle.sh <tag>`: `install.sh` (deploy/install.sh with the
# tag stamped in place of @RELEASE_TAG@), `aicc-deploy-<tag>.tar.gz` (the files
# the stack mounts, with compose.release.yml stamped from
# compose.release.yml.in) and `checksums.txt` (sha256 of both). The committed
# files keep their placeholders; the deploy-tags job refuses a hand-stamped one.
# The one-liner, `curl -fsSL <repo>/releases/latest/download/install.sh | sh`,
# resolves to the latest full release: GitHub's `releases/latest` skips
# pre-releases, so a pre-release is installed with its own URL
# (`releases/download/<tag>/install.sh`) or with `--version <tag>`.
#
# The `smoke` job gates the GitHub release: it runs scripts/installer-smoke.sh,
# the stamped installer against these images (--provider none) on amd64 and
# arm64, and requires `aicc doctor` to pass. The static checks run on pull
# requests in installer.yml.
#
# Before tagging, name the tag everywhere the deploy-tags job checks: the
# AICC_FS_IMAGE default in deploy/docker-compose.yml, both image tags in
# deploy/README.md and deploy/.env.example, and the `git clone --branch <tag>`
# line in deploy/README.md.
#
# Tags: a release publishes each image under the exact git tag and nothing else —
# `rasonyang/ai-native-callcenter:v0.1.0`, `rasonyang/freeswitch-aicc:v0.1.0`.
# No `latest`, no floating `0.1`, no v-stripped alias: a deployment names the
# build it runs, and a tag that moves cannot be named. A `workflow_dispatch` run
# builds both images but pushes nothing; it builds the installer bundle under a
# dry-run tag and uploads it as a workflow artifact, never to a release.
#
# Credentials: both images go to Docker Hub, so the repository needs
# `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` (an access token with Read & Write,
# not the account password) as secrets. Without them a tag build fails at the
# login step rather than pushing nothing quietly.
#
# `make fs-push VERSION=<tag>` still builds and pushes the switch image by hand,
# for a manual build; a release does not use it.
#
# Pre-releases: a tag whose name contains a hyphen (`v0.1.0-rc.1`) is marked as a
# pre-release on GitHub; a plain `v0.1.0` is a full release. Only a full release
# becomes `releases/latest`, which the one-liner installs.
#
# Notes: the release body comes from `scripts/release-notes.sh <tag>` — the
# CHANGELOG.md section for the tag when there is one, otherwise the commit
# subjects since the previous tag.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run against any commit: builds and pushes nothing.
  workflow_dispatch:

permissions:
  contents: write   # creating the release

jobs:
  # The deploy stack and its documentation name the images of one release. A
  # tag whose deploy/ still names an older release publishes images nobody's
  # stack pulls, or worse: v0.1.0-rc.2 shipped a deploy stack defaulting to a
  # switch image that predated the application's migrations, and every phone
  # REGISTER was answered 403. This runs before either image is built, so a
  # mismatch pushes nothing.
  deploy-tags:
    name: deploy-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # scripts/release-bundle.sh stamps the tag into copies of these two
      # files. A committed file already carrying a tag would ship that tag
      # under every later release, so the placeholders must still be there.
      - name: Check the installer's placeholders are unstamped
        run: |
          failed=0
          if ! grep -qF "@RELEASE_TAG@" deploy/install.sh; then
            echo "::error file=deploy/install.sh::deploy/install.sh must keep AICC_RELEASE='@RELEASE_TAG@'; scripts/release-bundle.sh stamps the tag, never a commit"
            failed=1
          fi
          if ! grep -qF "@TAG@" deploy/compose.release.yml.in; then
            echo "::error file=deploy/compose.release.yml.in::deploy/compose.release.yml.in must keep its @TAG@ placeholders; scripts/release-bundle.sh stamps the tag, never a commit"
            failed=1
          fi
          exit "$failed"

      - name: Check deploy/ names this release
        if: github.ref_type == 'tag'
        run: |
          app="rasonyang/ai-native-callcenter:${GITHUB_REF_NAME}"
          fs="rasonyang/freeswitch-aicc:${GITHUB_REF_NAME}"
          failed=0
          if ! grep -qF "\${AICC_FS_IMAGE:-${fs}}" deploy/docker-compose.yml; then
            echo "::error file=deploy/docker-compose.yml::the default for AICC_FS_IMAGE must be ${fs}; set \${AICC_FS_IMAGE:-${fs}} before tagging again"
            failed=1
          fi
          # -w so that v0.1.0-rc.3 does not pass on a file naming v0.1.0-rc.30.
          for f in deploy/README.md deploy/.env.example; do
            for image in "$app" "$fs"; do
              if ! grep -qwF "$image" "$f"; then
                echo "::error file=${f}::${f} must name ${image}; update the image tags in it before tagging again"
                failed=1
              fi
            done
          done
          # The guide clones this tag, because compose mounts files from the
          # checkout; a guide cloning main mounts files of another release.
          # The trailing space does what -w does above, and more: neither
          # v0.1.0-rc.3 nor v0.1 passes on a line cloning v0.1.0-rc.30 or
          # v0.1.1 (-w cannot be combined with it; the URL follows the space).
          if ! grep -qF -- "--branch ${GITHUB_REF_NAME} " deploy/README.md; then
            echo "::error file=deploy/README.md::deploy/README.md must clone with --branch ${GITHUB_REF_NAME}; update the git clone line before tagging again"
            failed=1
          fi
          exit "$failed"

  image:
    name: image
    # After the switch has built on both architectures: the application image
    # is pushed as soon as it builds, and one pushed without its switch is a
    # tag nobody can deploy.
    needs: [deploy-tags, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No QEMU. The Dockerfile's build stages run on this runner's own
      # architecture and cross-compile; without an emulator registered, a RUN
      # that ever needs the arm64 platform fails here instead of slowing down.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: rasonyang/ai-native-callcenter
          # The exact tag, and only that. `type=sha` gives a dispatch run
          # something to label the image it builds and never pushes.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ github.ref_type != 'tag' }}

      # One architecture, loaded into the runner's own daemon, so that the
      # image can be run before it is pushed: an image that cannot say which
      # build it is cannot be supported. The multi-arch build below is the same
      # Dockerfile against the same cache, so this costs a copy, not a build.
      - name: Build linux/amd64 for the version check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aicc:version-check
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the stamped version
        run: |
          out="$(docker run --rm aicc:version-check --version)"
          echo "$out"
          case "$out" in
            *"aicc ${GITHUB_REF_NAME} "*) ;;
            *) echo "::error::--version does not carry ${GITHUB_REF_NAME}: ${out}"; exit 1 ;;
          esac

      # The image builds the SPA itself, so there is no artifact to hand it:
      # one Dockerfile, one way to build it, wherever it is built.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The switch image, one native runner per architecture. No QEMU: gcc
  # segfaults at random under QEMU user-mode emulation (freeswitch/build.sh),
  # and the failure looks like a source problem rather than an emulation one.
  # Each leg pushes its image by digest only; switch-manifest puts the tag on
  # the pair. fail-fast stays on: a release missing one architecture is not a
  # release.
  switch:
    name: switch (${{ matrix.platform }})
    needs: [deploy-tags]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The build args are the ones build.sh passes. FS_VERSION and SOUNDS are
      # build.sh's defaults, given explicitly so the freeswitch.version label
      # names what was built even if the Dockerfile's ARG default moves. The
      # Dockerfile sets the labels itself; metadata-action's would overwrite
      # org.opencontainers.image.version and .revision, so it is not used here.
      # A dispatch run exports to the cache only.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: freeswitch
          file: freeswitch/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FS_VERSION=v1.11.3
            SOUNDS=8000
            GIT_REVISION=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          outputs: ${{ github.ref_type == 'tag' && 'type=image,name=rasonyang/freeswitch-aicc,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          cache-from: type=gha,scope=switch-${{ matrix.arch }}
          cache-to: type=gha,scope=switch-${{ matrix.arch }},mode=max

      - name: Export the digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag'
        with:
          name: switch-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the two per-architecture digests as one multi-arch manifest.
  switch-manifest:
    name: switch-manifest
    needs: [switch]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: switch-digest-*
          merge-multiple: true

      - name: Create the manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "rasonyang/freeswitch-aicc:${GITHUB_REF_NAME}" \
            $(printf 'rasonyang/freeswitch-aicc@sha256:%s ' *)

      - name: Check both architectures are in it
        run: |
          image="rasonyang/freeswitch-aicc:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect "$image"
          platforms="$(docker buildx imagetools inspect --raw "$image" \
            | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)"')"
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "$want" <<<"$platforms"; then
              echo "::error::${image} has no ${want} image"
              exit 1
            fi
          done

  # A dispatch run's installer bundle: built as a release would build it, under
  # a tag no release carries, and kept as a workflow artifact only.
  bundle-dry-run:
    name: bundle-dry-run
    needs: [deploy-tags]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the installer bundle
        run: scripts/release-bundle.sh "v0.0.0-dryrun+${GITHUB_SHA::12}" "${RUNNER_TEMP}/assets"

      - name: Verify the checksums
        working-directory: ${{ runner.temp }}/assets
        run: sha256sum -c checksums.txt

      - uses: actions/upload-artifact@v6
        with:
          name: installer-bundle
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 7

  # The release as a user gets it, before it is announced: the stamped
  # install.sh from a bundle built here, run with --provider none against the
  # images just pushed, on each architecture the images are built for. aicc
  # doctor inside the installer must pass; publish waits for both. The images
  # are already on Docker Hub by now (tags are immutable by convention, never
  # `latest`), so a failure here blocks the GitHub release, not the images.
  # Native runners, no QEMU.
  smoke:
    name: smoke (${{ matrix.arch }})
    needs: [image, switch-manifest]
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install the release and run aicc doctor
        run: scripts/installer-smoke.sh "${GITHUB_REF_NAME}"

  publish:
    name: publish
    needs: [image, switch-manifest, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # The notes are written from the history between two tags, so this
      # checkout needs all of it — and the tags themselves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      # What the one-line installer downloads: install.sh with this tag stamped
      # in, the deploy bundle, and their checksums.
      - name: Installer bundle
        run: |
          scripts/release-bundle.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/assets"
          (cd "${RUNNER_TEMP}/assets" && sha256sum -c checksums.txt)

      # The release is the two images, which the notes name, and the three
      # installer files attached here.
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ runner.temp }}/assets/install.sh
            ${{ runner.temp }}/assets/aicc-deploy-${{ github.ref_name }}.tar.gz
            ${{ runner.temp }}/assets/checksums.txt
          fail_on_unmatched_files: true
          # A hyphen in the tag is a pre-release: v0.1.0-rc.1, v0.2.0-beta.2.
          prerelease: ${{ contains(github.ref_name, '-') }}
